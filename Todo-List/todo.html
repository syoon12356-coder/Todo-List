<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TodoMate - 스마트한 할 일 관리</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="todo-container">
      <header>
        <h1>TodoMate</h1>
        <p>우선순위를 정해 체계적으로 관리하세요.</p>
      </header>

      <section class="todo-form-section">
        <form id="todo-form">
          <div class="form-group">
            <input
              type="text"
              id="todo-title"
              placeholder="제목을 입력하세요 (예: 알고리즘 과제)"
              required
            />
          </div>
          <div class="form-group">
            <textarea
              id="todo-content"
              placeholder="상세 내용을 입력하세요"
              required
            ></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="todo-date">마감 날짜</label>
              <input type="date" id="todo-date" required />
            </div>
            <div class="form-group">
              <label for="todo-priority">중요도</label>
              <select id="todo-priority">
                <option value="high">🔥 높음</option>
                <option value="medium">⚡ 보통</option>
                <option value="low">👇 낮음</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn-submit">할 일 등록하기</button>
        </form>
      </section>

      <section class="todo-list-section">
        <h2>나의 할 일 목록</h2>
        <ul id="todo-list"></ul>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
